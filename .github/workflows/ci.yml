name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Rebuilds main.js and versions.json, runs all tests, and fails if the committed
      # bundle is stale (someone changed src/ without running `npm run build`).
      - name: Build, test and check bundle is up to date
        run: npm run check
